<style>

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}

.btn.g{background:var(--s1);color:var(--tx);border:1px solid var(--bd)}.btn.off{opacity:.4;pointer-events:none}
.stk{display:grid;gap:10px;margin-top:18px}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom));justify-content:center;gap:6px}

#nav button.on{color:var(--am);background:var(--amd)}
.top{display:flex;align-items:center;gap:12px}
.tm{font-size:17px;padding:8px 12px;border-radius:10px;background:var(--s1);border:1px solid var(--bd);margin-left:auto}
.tm.low{color:var(--bad);border-color:var(--bad)}
.pg{height:4px;background:var(--s2);border-radius:4px;margin:14px 0 18px;overflow:hidden}.pg i{display:block;height:100%;background:var(--am)}
.q{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:10px 0 18px}

.foot .btn{flex:1}.foot .ib{flex:none;width:50px;height:50px}.foot .ib.fl{color:var(--am);border-color:var(--am)}
.ring{display:grid;place-items:center;margin:18px 0}.ring div{position:absolute;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{width:100%;max-width:560px;background:var(--s1);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.gr{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.gr button{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:var(--s2);font:500 13px 'JetBrains Mono',monospace}
.gr .an{background:var(--amd);border-color:var(--am);color:var(--am)}.gr .fl{outline:2px solid var(--am)}.gr .cu{background:var(--am);color:var(--ink)}
.rv{padding:16px;margin-bottom:12px}.rv .opt{padding:10px 12px;margin-bottom:6px;font-size:14px}
.tag{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin-left:auto;white-space:nowrap}
.hist{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.fb.hint{background:var(--amd);border-color:var(--am)}
.lk{margin-top:8px;color:var(--am);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.opt.rm{opacity:.35;text-decoration:line-through;pointer-events:none}
.nt h3{margin:24px 0 8px}.nt p{margin:0 0 12px}
.li{padding:2px 0 10px 14px;border-left:2px solid var(--am);margin:0 0 8px}
.li b{display:block;font-weight:600;margin-bottom:2px}
.danger{color:var(--bad)!important;border-color:var(--bad)!important}
[data-pal=green]:not([data-theme=light]){--bg:#000;--s1:#080d09;--s2:#101812;--bd:#1b2a1f;--tx:#e8f3ec;--mu:#86a08e;--am:#4ade80;--amd:#0b2616;--ok:#2dd4bf;--okb:#06231f;--bad:#ff6b6b;--badb:#2a1010;--ink:#021208}
[data-pal=green][data-theme=light]{--bg:#f2f7f3;--s1:#fff;--s2:#e4eee7;--bd:#cfdcd3;--tx:#10201a;--mu:#5a6e62;--am:#157a3a;--amd:#d6f0dd;--ok:#0f766e;--okb:#d5f1ec;--bad:#b3392a;--badb:#f8dfd9;--ink:#fff}
.sw{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);flex:none}
.tile.on{border-color:var(--am);background:var(--amd)}
.inp{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font:inherit;margin-top:10px}
textarea.inp{min-height:120px;resize:vertical;font:12px/1.4 'JetBrains Mono',ui-monospace,monospace}
.foot .inp{margin:0;flex:1;min-width:0;height:50px}
.lbr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.lbr .rk{width:26px;font:500 15px 'JetBrains Mono',monospace;color:var(--mu)}
.lbr.me{background:var(--amd);margin:0 -10px;padding:12px 10px;border-radius:12px;border-bottom-color:transparent}
.msg{max-width:84%;margin:0 0 10px;padding:9px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);word-break:break-word;white-space:pre-wrap}
.msg.me{margin-left:auto;background:var(--amd);border-color:var(--am)}
.msg .who{font:500 11px 'JetBrains Mono',monospace;color:var(--am);margin-bottom:2px}
.msg .tt{font-size:11px;color:var(--mu);margin-top:3px;white-space:normal}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;user-drag:none}
</style>

<script>
const T=["Aseptic Technique","Gram Staining","Gram-Positive vs Gram-Negative","Prokaryotes vs Eukaryotes","Microbial Media","Autoclave Operation","Microbial Growth Curve","Introduction and Structures","Shapes of Microorganisms","Sterilization Methods","Medical Microbiology","Microbial Genetics"];
/* [topic, question, correct, wrong1, wrong2, wrong3, explanation] — correct answer is always first and shuffled at runtime */
const Q=[
[0,"Which statement best defines aseptic technique?","Practices that prevent contamination of sterile areas or materials by microorganisms","Heating a sample until all organisms are dead","Growing microbes on nutrient media","Staining bacteria to identify them","Aseptic technique is a set of practices designed to prevent contamination of sterile areas or materials."],
[0,"What is essential before performing any aseptic procedure?","Hand hygiene with soap and water or an alcohol-based sanitizer","Leaving instruments open on the bench","Switching off all ventilation","Adding antibiotics to the work surface","Thorough hand hygiene is the first requirement of aseptic work."],
[0,"A sterile field is maintained by:","Using sterile drapes or barriers and placing only sterile items on it","Covering the bench with any clean cloth","Placing open cultures on the edge of the bench","Spraying gloves once at the start","Only sterile items belong on or within the designated sterile area."],
[0,"Why are aseptic gowning and gloving important?","They minimize shedding of microorganisms from skin, hair and clothing","They sterilize the instruments","They increase airflow in the room","They dissolve biohazardous waste","Correct gowning and gloving lowers the risk of contamination from the worker."],
[0,"Where should sharps and biohazardous waste be placed?","Designated containers, following disposal protocols","The ordinary waste bin","Down the laboratory sink","Back inside the sterile field","Proper disposal prevents the spread of microorganisms."],
[0,"Which environmental control supports aseptic work?","Minimizing airflow disruptions and regularly disinfecting work areas","Keeping windows open for fresh air","Allowing surfaces to stay uncleaned between runs","Maximizing foot traffic around the field","Environmental control includes limiting airflow disruption, controlling temperature and humidity, and cleaning."],
[0,"Which methods are used to sterilize items that contact sterile areas or samples?","Autoclaving, chemical disinfection or sterile filtration","Rinsing with tap water","Wiping with a dry cloth","Leaving them exposed to room air","Instruments must be sterilized or sanitized by methods such as these."],
[1,"Who developed the Gram staining method, and in which year?","Hans Christian Gram, 1884","Louis Pasteur, 1864","Robert Koch, 1910","Alexander Fleming, 1928","The method was developed by Danish bacteriologist Hans Christian Gram in 1884."],
[1,"What is the correct order of reagents in the Gram stain?","Crystal violet, Gram’s iodine, decolorizer, safranin","Safranin, Gram’s iodine, ethanol, crystal violet","Crystal violet, safranin, Gram’s iodine, ethanol","Gram’s iodine, crystal violet, acetone, safranin","Primary stain, mordant, decolorizer, then counterstain."],
[1,"What is the role of Gram’s iodine?","A mordant that helps crystal violet form a complex retained in peptidoglycan","The primary stain","The decolorizing agent","The counterstain","The mordant increases the retention of the crystal violet complex."],
[1,"Which agent is usually used to decolorize the smear?","Ethanol or acetone","Safranin","Crystal violet","Gram’s iodine","Alcohol or acetone differentiates Gram-positive from Gram-negative cells."],
[1,"After the full procedure, how do Gram-negative bacteria appear?","Pink or red","Purple","Colorless","Yellow","They lose the crystal violet complex and take up the safranin counterstain."],
[1,"Which reagent is the counterstain?","Safranin or basic fuchsin","Crystal violet","Gram’s iodine","Acetone","The counterstain colors the decolorized Gram-negative cells."],
[1,"Why do Gram-negative bacteria lose the crystal violet-iodine complex?","The decolorizer disrupts their outer membrane and their peptidoglycan layer is thin","Their thick peptidoglycan traps the dye","They have teichoic acids that bind iodine","They have no cell membrane","Gram-negative cells have thin peptidoglycan surrounded by an outer membrane that the decolorizer disrupts."],
[1,"What is heat fixation used for when preparing a smear?","To help the bacteria adhere to the slide","To stain the cells purple","To remove the outer membrane","To sterilize the stain","Heat fixation adheres the dried smear to the slide."],
[2,"What fraction of the Gram-positive cell wall can be peptidoglycan?","Up to about 90%","About 10%","About 50%","Less than 1%","Gram-positive walls have a thick peptidoglycan layer."],
[2,"Which description fits the Gram-negative cell wall?","Thin peptidoglycan (about 10%) plus an outer membrane containing LPS","Thick peptidoglycan with no outer membrane","No peptidoglycan at all","A wall made mainly of chitin","The outer membrane contains lipopolysaccharides and lipoproteins."],
[2,"Teichoic and lipoteichoic acids are characteristic of:","Gram-positive cell walls","The Gram-negative outer membrane","Eukaryotic nuclei","Viral capsids","They are interspersed in the thick peptidoglycan and add rigidity and stability."],
[2,"Lipopolysaccharide (LPS) is best described as:","A potent endotoxin in the Gram-negative outer membrane","A mordant used in staining","A Gram-positive wall polymer","An antibiotic","LPS plays roles in pathogenesis and immune evasion."],
[2,"What is the function of porins?","They regulate the passage of molecules through the outer membrane","They synthesize peptidoglycan","They carry out protein synthesis","They store genetic material","Porins in the outer membrane control entry of molecules."],
[2,"Why are Gram-positive bacteria generally more susceptible to penicillin and vancomycin?","These drugs target cell wall synthesis and the thick peptidoglycan is not shielded by an outer membrane","They have efflux pumps","They lack a cell wall","They have an outer membrane barrier","Cell wall synthesis inhibitors act well on Gram-positive organisms."],
[2,"Which features make Gram-negative bacteria often more resistant to antibiotics?","An outer membrane barrier and efflux pumps","A thick peptidoglycan layer","Teichoic acids","Absence of a cell membrane","The outer membrane limits drug entry and efflux pumps remove antibiotics."],
[2,"Which group may trigger strong inflammatory responses because of LPS?","Gram-negative bacteria","Gram-positive bacteria","Eukaryotic cells","Spore-forming fungi","Their outer membrane LPS can contribute to severe infections."],
[3,"Where is the genetic material of a prokaryotic cell located?","In the nucleoid, which is not membrane-enclosed","Inside a membrane-bound nucleus","Inside mitochondria","Inside the Golgi apparatus","Prokaryotes lack a true nucleus."],
[3,"Prokaryotic DNA is typically:","A single circular chromosome without histones","Multiple linear chromosomes with histones","Organized into chromatin","Full of introns","Histones, chromatin and introns are features of eukaryotes."],
[3,"Which feature is often found in eukaryotic genes but not in prokaryotic genes?","Introns","Operons of circular DNA","Binary fission","A nucleoid","Introns are non-coding regions removed during RNA processing."],
[3,"What is the typical size range of prokaryotic cells?","0.1 to 5 micrometers","10 to 100 micrometers","100 to 500 micrometers","1 to 5 millimeters","Eukaryotic cells are larger, about 10 to 100 micrometers."],
[3,"How do prokaryotes mainly reproduce?","Binary fission","Mitosis","Meiosis","Cytokinesis after nuclear division","Binary fission gives two daughter cells with identical genetic material."],
[3,"Which structures are absent from prokaryotic cells?","Mitochondria, endoplasmic reticulum, Golgi apparatus and lysosomes","Ribosomes and DNA","A plasma membrane","A cell wall in all species","Prokaryotes lack membrane-bound organelles."],
[3,"What is the main component of a plant cell wall?","Cellulose","Peptidoglycan","Chitin","Lipopolysaccharide","Some eukaryotic cells, such as plant cells, have a cellulose wall."],
[3,"What is the role of the Golgi apparatus?","Modifies and packages proteins for secretion","Produces ATP","Carries out intracellular digestion","Stores the nucleoid","Mitochondria make ATP and lysosomes digest, while the Golgi packages proteins."],
[4,"Nutrient agar is made of:","Beef extract, peptone and agar","Blood and serum only","Peptone and glucose only","Agar and crystal violet","It is a solid, general-purpose medium."],
[4,"How does nutrient broth differ from nutrient agar?","It is liquid because it lacks agar","It contains blood","It is selective for Gram-negative cells","It is used only for transport","Broth propagates organisms in suspension."],
[4,"What do selective media do?","Promote growth of specific microorganisms while inhibiting others","Preserve viability during transport","Remove all oxygen","Add nothing but water","Selective media favor wanted organisms and inhibit the rest."],
[4,"MacConkey agar selects for:","Gram-negative bacteria","Staphylococcus species","Strict anaerobes only","Fungi only","It is the example given of a medium selecting for Gram-negative bacteria."],
[4,"Mannitol Salt agar selects for:","Staphylococcus species","Gram-negative bacteria","Spirochetes","Viruses","It is a selective medium for Staphylococcus."],
[4,"Blood agar is a differential medium because it distinguishes bacteria by:","Their ability to hemolyze red blood cells","Their cell wall thickness","Their flagella","Their size","Differential media reveal metabolic differences visually."],
[4,"Which pair are examples of enriched media?","Blood agar and chocolate agar","Nutrient broth and nutrient agar","MacConkey and Mannitol Salt agar","Transport and anaerobic broth","Enriched media support fastidious organisms with complex growth needs."],
[4,"What is the purpose of transport media?","To preserve microbial viability between collection and the laboratory","To select for Staphylococcus","To differentiate by hemolysis","To grow organisms industrially","They maintain pH and osmotic balance of the sample."],
[5,"What should be done before first operating an autoclave?","Read the manufacturer’s manual","Run it empty with no water","Open the door during heating","Load it with sealed airtight bottles","The manual explains features, capabilities and safety precautions."],
[5,"What type of water is added to the autoclave reservoir?","Distilled water, in the amount the manufacturer specifies","Any tap water","Saline solution","Disinfectant","Water amount varies with the autoclave model."],
[5,"Why should the load be arranged carefully?","So steam can penetrate effectively","So items touch each other tightly","To reduce the pressure","To avoid using containers","Poor arrangement prevents steam reaching all surfaces."],
[5,"Which parameters are set on the control panel?","Temperature, pressure and sterilization cycle time","Humidity and light intensity","pH and osmotic balance","Voltage and gas flow only","These follow the manufacturer’s guidelines and the materials being sterilized."],
[5,"What should happen after the cycle is complete?","Allow the autoclave to cool before opening","Open the door immediately","Add more water at once","Turn the load upside down","Cooling prevents sudden steam release and burns."],
[5,"How should the autoclave door be opened?","Standing to the side, with heat-resistant gloves if needed","Facing it directly","With bare hands while still hot","Only after removing the gasket","This avoids exposure to hot steam."],
[5,"Which information should be recorded for each cycle?","Date, time, cycle parameters and contents of the run","Only the operator’s name","Only the room temperature","Nothing, if the cycle succeeded","Records support quality control and regulatory compliance."],
[5,"Why must the door gasket be clean and in good condition?","To prevent steam leakage","To reduce cooling time","To increase water use","To sterilize the water","A sealed chamber depends on an intact gasket."],
[6,"What is the correct order of the microbial growth phases?","Lag, log, stationary, death","Log, lag, stationary, death","Lag, stationary, log, death","Stationary, lag, log, death","The growth curve begins with adaptation and ends with decline."],
[6,"What happens in the lag phase?","Cells adapt and synthesize enzymes with no apparent increase in number","The population doubles at a constant rate","Growth and death are balanced","Cell death exceeds division","Cells are metabolically active but not yet dividing noticeably."],
[6,"During which phase is the growth rate maximal under optimal conditions?","Logarithmic (log) phase","Lag phase","Stationary phase","Death phase","Cells divide and multiply at a constant rate in this phase."],
[6,"What characterizes the stationary phase?","Cell growth is balanced by cell death, giving a plateau","Rapid exponential increase","Complete lack of metabolism","Rapid decline in viable cells","Nutrient depletion and waste slow the growth rate."],
[6,"What causes the death phase?","Cell death exceeds cell division as nutrients deplete and wastes accumulate","The cells are adapting to a new medium","Nutrients become unlimited","Cells divide at a constant rate","The number of viable cells declines."],
[6,"A typical growth curve describes growth in:","A closed system with a limited nutrient supply","An open system with unlimited nutrients","A sterile solution with no cells","A system without time","This is the setting in which the four phases appear."],
[6,"Which is a use of microbial growth curves?","Assessing the efficacy of antimicrobial agents","Staining cell walls","Counting chromosomes","Preparing sterile drapes","They also help study growth kinetics and optimize fermentation."],
[6,"What influences the length of the lag phase?","Species, growth medium composition and environmental conditions","Only the color of the medium","The size of the incubator door","Nothing; it is fixed","Lag duration varies with species and conditions."],
[7,"Microbiology is the study of:","Microscopic organisms such as bacteria, viruses, fungi, protozoa and algae","Only human cells","Only plants","Only large animals","These organisms are often too small to see without microscopes."],
[7,"What is the bacterial cell wall primarily composed of?","Peptidoglycan","Chitin","Cellulose","Glucans","Fungal walls contain chitin or glucans."],
[7,"Fungal cell walls contain:","Chitin or glucans","Peptidoglycan","Lipopolysaccharide","Teichoic acid","Cell wall composition differs among microorganisms."],
[7,"What is the function of the plasma membrane?","Separates the cell interior from the environment and regulates passage of molecules","Stores genetic information","Makes the cell wall","Produces flagella","All microorganisms have a plasma membrane."],
[7,"Where does protein synthesis occur?","On ribosomes in the cytoplasm","In the capsule","In pili","In the cell wall","Ribosomes are found in the cytoplasm."],
[7,"What does a capsule do?","Protects against drying and helps evade the host immune system","Allows swimming","Synthesizes protein","Stores DNA","It is a thick, gelatinous layer around the cell wall."],
[7,"Pili or fimbriae are involved in:","Attachment and bacterial conjugation","Energy production","Protein synthesis","Staining reactions","They are hair-like surface appendages."],
[7,"How do flagella differ from cilia?","Flagella are long and whip-like, whereas cilia are shorter and more numerous","Flagella are short and numerous","Cilia are long and few","They are identical","Both are used for movement."],
[8,"Cocci are:","Spherical or ovoid microorganisms","Rod-shaped","Comma-shaped","Corkscrew-shaped","Examples include Staphylococcus, Streptococcus and Neisseria."],
[8,"Staphylococci are cocci arranged in:","Clusters","Chains","Tetrads","Single rods","Streptococci form chains."],
[8,"Streptococci are cocci arranged in:","Chains","Clusters","Pairs only","Spirals","Diplococci are pairs and tetrads are groups of four."],
[8,"Bacilli are:","Rod-shaped","Spherical","Spiral","Comma-shaped","Examples include Escherichia coli and Bacillus anthracis."],
[8,"Which shape is flexible and helical, moving by axial filaments?","Spirochetes","Spirilla","Vibrios","Cocci","Treponema pallidum is an example."],
[8,"Vibrio cholerae is:","Comma-shaped","Spherical","Stalked","Filamentous","Vibrios are curved rods and are often motile."],
[8,"What describes pleomorphic microorganisms?","They vary in shape and lack a fixed form","They are always spherical","They are always rod-shaped","They always form chains","Some Mycoplasma species are an example."],

const N=[{"title":"Aseptic Technique","b":[{"t":"p","x":"Aseptic technique is a set of practices designed to prevent contamination of sterile areas or materials by microorganisms. It is commonly used in medical and laboratory settings where maintaining a sterile environment is crucial to prevent the spread of infection or contamination of experimental samples."},{"t":"p","x":"Here are some key principles and practices of aseptic technique:"},{"t":"li","h":"Hand hygiene","x":"Thoroughly washing hands with soap and water or using an alcohol-based hand sanitizer is essential before performing any aseptic procedures."},{"t":"li","h":"Use of personal protective equipment (PPE)","x":"This includes wearing gloves, gowns, masks, and sometimes goggles or face shields to protect against contamination from microorganisms carried on the body or in respiratory droplets."},{"t":"li","h":"Sterile equipment and supplies","x":"All instruments, containers, and materials that come into contact with sterile areas or samples must be sterilized or sanitized using methods such as autoclaving, chemical disinfection, or sterile filtration."},{"t":"li","h":"Sterile field","x":"Creating and maintaining a sterile field involves using sterile drapes or barriers to cover work surfaces and only placing sterile items on or within the designated sterile area."},{"t":"li","h":"Proper handling techniques","x":"Careful handling of sterile items, including avoiding contact with non-sterile surfaces or items, minimizing movement within the sterile field, and using sterile techniques when transferring or manipulating materials."},{"t":"li","h":"Environmental control","x":"Maintaining a clean and controlled environment by minimizing airflow disruptions, controlling temperature and humidity, and regularly cleaning and disinfecting work areas."},{"t":"li","h":"Aseptic gowning and gloving","x":"Proper gowning and gloving techniques help prevent contamination of sterile areas by minimizing the risk of shedding microorganisms from the skin, hair, or clothing."},{"t":"li","h":"Disposal of waste","x":"Proper disposal of contaminated materials and waste is essential to prevent the spread of microorganisms. This includes using designated containers for sharps and biohazardous waste and following appropriate protocols for disposal."},{"t":"p","x":"Aseptic technique is crucial in various fields, including medicine, pharmaceuticals, biotechnology, and food production, where maintaining sterility is critical to ensure product safety and integrity. Regular training and adherence to established protocols are essential for effective implementation of aseptic technique practices."}]},{"title":"Gram Staining","b":[{"t":"p","x":"Gram staining is a common microbiological technique used to differentiate bacteria into two groups based on the properties of their cell walls. The method was developed by Danish bacteriologist Hans Christian Gram in 1884 and remains widely used today."},{"t":"p","x":"The Gram staining procedure involves several steps:"},{"t":"li","h":"Preparation of a bacterial smear","x":"A small sample of the bacterial culture is spread onto a clean microscope slide and allowed to air dry. Heat fixation may be used to adhere the bacteria to the slide."},{"t":"li","h":"Primary stain (Crystal Violet)","x":"The smear is flooded with a crystal violet solution, which stains all bacteria purple."},{"t":"li","h":"Mordant (Gram's iodine)","x":"A mordant, typically Gram's iodine, is applied to the smear. This helps the crystal violet dye form a complex with the peptidoglycan layer of the bacterial cell wall, increasing its retention."},{"t":"li","h":"Decolorization","x":"The slide is rinsed with a decolorizing agent, usually ethanol or acetone. This step differentiates between Gram-positive and Gram-negative bacteria. Gram-positive bacteria retain the crystal violet-iodine complex and appear purple, while Gram-negative bacteria lose the stain and become colorless."},{"t":"li","h":"Counterstain (Safranin)","x":"The smear is then stained with a contrasting color, usually safranin or basic fuchsin. This counterstain colors the decolorized Gram-negative bacteria pink or red but has little effect on the purple Gram-positive bacteria."},{"t":"p","x":"After staining, the slide is observed under a light microscope. Gram-positive bacteria will appear purple, while Gram-negative bacteria will appear pink or red."},{"t":"p","x":"The differential staining characteristic of Gram staining is based on differences in the cell wall structure of bacteria. Gram-positive bacteria have a thick layer of peptidoglycan in their cell walls, which retains the crystal violet-iodine complex, while Gram-negative bacteria have a thinner layer of peptidoglycan surrounded by an outer membrane containing lipopolysaccharides. This outer membrane is disrupted by the decolorization step, causing the loss of the crystal violet-iodine complex."},{"t":"p","x":"Gram staining is a rapid and valuable tool for microbiologists to identify and classify bacteria, aiding in the diagnosis and treatment of infections. However, it's important to note that some bacteria may not conform to the typical Gram staining characteristics, and additional biochemical or molecular tests may be necessary for accurate identification."}]},{"title":"Gram-Positive vs Gram-Negative","b":[{"t":"p","x":"Gram-positive and Gram-negative bacteria are two major groups of bacteria distinguished by differences in their cell wall structure, which result in contrasting responses to the Gram staining procedure. Here are the key differences between Gram-positive and Gram-negative bacteria:"},{"t":"h","x":"Cell wall structure"},{"t":"li","h":"","x":"Gram-positive bacteria have a thick layer of peptidoglycan in their cell walls, which accounts for up to 90% of the cell wall's composition. This thick layer retains the crystal violet-iodine complex during Gram staining, resulting in a purple color."},{"t":"li","h":"","x":"Gram-negative bacteria have a thinner layer of peptidoglycan in their cell walls, comprising only about 10% of the cell wall's composition. Additionally, they have an outer membrane containing lipopolysaccharides (LPS) and lipoproteins. This outer membrane makes the cell wall more complex and less permeable. During Gram staining, the outer membrane of Gram-negative bacteria is disrupted by the decolorizing agent, leading to the loss of the crystal violet-iodine complex and subsequent staining with the counterstain, appearing pink or red."},{"t":"h","x":"Cell wall composition"},{"t":"li","h":"","x":"In Gram-positive bacteria, the thick layer of peptidoglycan is interspersed with teichoic acids and lipoteichoic acids, which contribute to the overall rigidity and stability of the cell wall."},{"t":"li","h":"","x":"In Gram-negative bacteria, the outer membrane contains lipopolysaccharides (LPS), which are potent endotoxins and play roles in pathogenesis and immune response evasion. The outer membrane also contains porins, which regulate the passage of molecules into the cell."},{"t":"h","x":"Sensitivity to antibiotics"},{"t":"li","h":"","x":"Gram-positive bacteria are generally more susceptible to antibiotics that target cell wall synthesis, such as penicillin and vancomycin, due to the presence of the thick peptidoglycan layer in their cell walls."},{"t":"li","h":"","x":"Gram-negative bacteria are often more resistant to antibiotics due to the presence of the outer membrane, which acts as a barrier and limits the entry of certain antibiotics. Additionally, Gram-negative bacteria may possess efflux pumps that actively remove antibiotics from the cell."},{"t":"h","x":"Pathogenicity and virulence factors"},{"t":"li","h":"","x":"Both Gram-positive and Gram-negative bacteria can be pathogenic and cause infectious diseases. However, the composition of their cell walls and outer membranes may influence their virulence and interactions with the host immune system."},{"t":"li","h":"","x":"Gram-negative bacteria, with their outer membrane containing LPS, may trigger strong inflammatory responses in the host, contributing to the severity of infections."},{"t":"p","x":"Understanding the differences between Gram-positive and Gram-negative bacteria is crucial for microbiologists, clinicians, and researchers in various fields, including medicine, microbiology, and biotechnology, as it helps in the diagnosis, treatment, and control of bacterial infections."}]},{"title":"Prokaryotes vs Eukaryotes","b":[{"t":"p","x":"Prokaryotes and eukaryotes are two major categories of organisms that differ primarily in the complexity and organization of their cellular structures. Here are the key differences between prokaryotic and eukaryotic cells:"},{"t":"h","x":"Cellular Organization"},{"t":"li","h":"","x":"Prokaryotic cells are simpler in structure and lack a true nucleus. Their genetic material is located in a region called the nucleoid, which is not enclosed by a membrane. Prokaryotic cells also lack membrane-bound organelles."},{"t":"li","h":"","x":"Eukaryotic cells are more complex and have a true nucleus, which houses the genetic material (DNA) within a membrane-bound nucleus. Eukaryotic cells contain various membrane-bound organelles, such as mitochondria, endoplasmic reticulum, Golgi apparatus, and lysosomes."},{"t":"h","x":"Nucleus"},{"t":"li","h":"","x":"In prokaryotic cells, the genetic material (DNA) is typically a single, circular chromosome located in the nucleoid region of the cell. There are no histones associated with the DNA, and there are no introns in prokaryotic genes."},{"t":"li","h":"","x":"Eukaryotic cells have multiple linear chromosomes within the nucleus. The DNA is associated with histone proteins and is organized into chromatin. Eukaryotic genes often contain introns, which are non-coding regions that are removed during RNA processing."},{"t":"h","x":"Membrane-bound Organelles"},{"t":"li","h":"","x":"Prokaryotic cells lack membrane-bound organelles such as mitochondria, endoplasmic reticulum, Golgi apparatus, and lysosomes."},{"t":"li","h":"","x":"Eukaryotic cells contain membrane-bound organelles that compartmentalize different cellular functions. For example, mitochondria are involved in energy production (ATP synthesis), the endoplasmic reticulum is involved in protein synthesis and processing, the Golgi apparatus modifies and packages proteins for secretion, and lysosomes are involved in intracellular digestion."},{"t":"h","x":"Cell Size"},{"t":"li","h":"","x":"Prokaryotic cells are generally smaller in size compared to eukaryotic cells. They typically range from 0.1 to 5 micrometers in diameter."},{"t":"li","h":"","x":"Eukaryotic cells are larger and more varied in size, ranging from 10 to 100 micrometers in diameter."},{"t":"h","x":"Reproduction"},{"t":"li","h":"","x":"Prokaryotic cells reproduce primarily through binary fission, a process where the cell divides into two daughter cells, each with identical genetic material."},{"t":"li","h":"","x":"Eukaryotic cells reproduce through mitosis (for somatic cells) or meiosis (for reproductive cells), which involves complex processes of nuclear division and cell division (cytokinesis)."},{"t":"h","x":"Presence of Cell Wall"},{"t":"li","h":"","x":"Many prokaryotic cells have a rigid cell wall outside the cell membrane, which provides structural support and protection. The composition of the cell wall varies among different types of prokaryotes."},{"t":"li","h":"","x":"While some eukaryotic cells also have cell walls (e.g., plant cells have a cellulose cell wall), they are generally simpler in structure compared to prokaryotic cell walls."},{"t":"p","x":"These differences in cellular organization and complexity have significant implications for the metabolism, growth, and ecological roles of prokaryotic and eukaryotic organisms."}]},{"title":"Microbial Media","b":[{"t":"p","x":"Microbial media, also known as growth media or culture media, are nutrient-rich substances used to cultivate and grow microorganisms such as bacteria, fungi, and protists in laboratory settings. These media provide essential nutrients required for the growth, reproduction, and metabolism of microorganisms."},{"t":"p","x":"There are several types of microbial media, classified based on their composition, purpose, and physical state. Here are some common types:"},{"t":"li","h":"Nutrient Agar","x":"Nutrient agar is a solid medium containing beef extract, peptone, and agar, a gel-like substance derived from seaweed. It is commonly used for the general cultivation and maintenance of a wide range of microorganisms."},{"t":"li","h":"Nutrient Broth","x":"Nutrient broth is a liquid medium with similar components to nutrient agar but lacks agar. It is used for the propagation of microorganisms in suspension."},{"t":"li","h":"Selective Media","x":"Selective media are formulated to selectively promote the growth of specific microorganisms while inhibiting the growth of others. Examples include MacConkey agar, which selects for Gram-negative bacteria, and Mannitol Salt agar, which selects for Staphylococcus species."},{"t":"li","h":"Differential Media","x":"Differential media contain substances that allow different types of microorganisms to be visually distinguished based on their metabolic activities or other characteristics. Blood agar, for example, differentiates bacteria based on their ability to hemolyze red blood cells."},{"t":"li","h":"Enriched Media","x":"Enriched media contain additional nutrients such as blood, serum, or special growth factors to support the growth of fastidious microorganisms, which have complex growth requirements. Examples include blood agar and chocolate agar."},{"t":"li","h":"Anaerobic Media","x":"Anaerobic media are designed to cultivate microorganisms that thrive in the absence of oxygen. These media are typically prepared in an oxygen-free environment and may contain reducing agents to eliminate any residual oxygen."},{"t":"li","h":"Transport Media","x":"Transport media are designed to preserve the viability of microorganisms during transport from the collection site to the laboratory for further analysis. They often contain substances to maintain the pH and osmotic balance of the sample."},{"t":"p","x":"Microbial media play a crucial role in various microbiological applications, including clinical diagnostics, research, food and beverage testing, pharmaceutical development, and environmental monitoring. The choice of media depends on the specific requirements of the microorganisms being cultured and the objectives of the experiment or analysis."}]},{"title":"Autoclave Operation","b":[{"t":"p","x":"Operating an autoclave safely and effectively is crucial to ensure proper sterilization of equipment and materials in laboratory settings. Here's a general guide on how to operate an autoclave:"},{"t":"li","h":"Read the Manual","x":"Before operating the autoclave, carefully read the manufacturer's manual to understand the specific features, capabilities, and safety precautions of the equipment."},{"t":"li","h":"Prepare the Load","x":"Place the items to be sterilized inside autoclave-safe containers, such as autoclavable bags or containers. Ensure that the load is arranged in a way that allows steam to penetrate effectively."},{"t":"li","h":"Add Water","x":"Fill the autoclave reservoir with distilled water according to the manufacturer's instructions. The amount of water required may vary depending on the autoclave model."},{"t":"li","h":"Close the Door Securely","x":"Close the autoclave door securely to create a sealed chamber. Make sure the door gasket is clean and in good condition to prevent steam leakage."},{"t":"li","h":"Set Sterilization Parameters","x":"Use the control panel to set the desired sterilization parameters, including temperature, pressure, and sterilization cycle time. Follow the guidelines provided by the manufacturer and consider the type of materials being sterilized."},{"t":"li","h":"Start the Cycle","x":"Initiate the sterilization cycle by pressing the appropriate buttons on the control panel. Some autoclaves may have pre-programmed cycles for common sterilization tasks, while others allow customization of cycle parameters."},{"t":"li","h":"Monitor the Cycle","x":"During the sterilization cycle, monitor the autoclave display to ensure that the temperature and pressure are within the specified range. Some autoclaves may have built-in sensors and alarms to alert users of any deviations from the set parameters."},{"t":"li","h":"Allow Cooling Time","x":"Once the sterilization cycle is complete, allow the autoclave to cool down before opening the door. This helps prevent the sudden release of steam and reduces the risk of burns."},{"t":"li","h":"Open the Door Safely","x":"Carefully open the autoclave door while standing to the side to avoid exposure to hot steam. Use heat-resistant gloves if necessary."},{"t":"li","h":"Remove Sterilized Items","x":"Remove the sterilized items from the autoclave using sterile tools or gloves. Be cautious as the items may still be hot."},{"t":"li","h":"Record Keeping","x":"Maintain accurate records of sterilization cycles, including the date, time, cycle parameters, and contents of each run. This is essential for quality control and compliance with regulatory requirements."},{"t":"li","h":"Routine Maintenance","x":"Follow the manufacturer's recommendations for routine maintenance and calibration of the autoclave to ensure its continued performance and safety."},{"t":"p","x":"By following these steps and adhering to proper safety practices, you can effectively operate an autoclave to achieve reliable sterilization of laboratory equipment and materials."}]},{"title":"Microbial Growth Curve","b":[{"t":"p","x":"The microbial growth curve describes the typical pattern of growth exhibited by populations of microorganisms over time when they are cultivated in a closed system with a limited nutrient supply. The curve typically consists of several distinct phases:"},{"t":"li","h":"Lag Phase","x":"During the lag phase, microorganisms are adapting to their new environment. While there is no apparent increase in population size, cells are metabolically active, synthesizing enzymes, and preparing for growth. The length of the lag phase varies depending on factors such as the species of microorganism, the composition of the growth medium, and the environmental conditions."},{"t":"li","h":"Logarithmic (Log or Exponential) Phase","x":"Once adaptation is complete, microorganisms enter the logarithmic phase, also known as the log or exponential phase. During this phase, the population size increases rapidly as cells divide and multiply at a constant rate. Growth is typically characterized by a steady increase in cell number and exponential growth of the population. Under optimal conditions, the growth rate is maximal during this phase."},{"t":"li","h":"Stationary Phase","x":"As the population size approaches the carrying capacity of the environment, nutrient depletion, waste accumulation, and other factors lead to a decrease in the growth rate. The stationary phase is characterized by a balance between cell growth and cell death, resulting in a plateau in population size. During this phase, the rate of cell division slows down, and the number of viable cells remains relatively constant."},{"t":"li","h":"Death Phase","x":"Eventually, the accumulation of waste products, depletion of nutrients, and other adverse conditions lead to a decline in the population size. The death phase is characterized by a decrease in the number of viable cells as cell death exceeds cell division. The rate of decline may vary depending on the severity of the environmental stressors."},{"t":"p","x":"It's important to note that while the microbial growth curve provides a general framework for understanding population dynamics, variations may occur depending on factors such as the specific microbial species, the composition of the growth medium, temperature, pH, oxygen availability, and other environmental conditions."},{"t":"p","x":"Microbial growth curves are fundamental in microbiology and are used to study the growth kinetics of microorganisms, assess the efficacy of antimicrobial agents, optimize industrial fermentation processes, and understand microbial ecology and population dynamics in natural environments."}]},{"title":"Introduction and Structures","b":[{"t":"p","x":"Microbiology is the branch of biology that deals with the study of microscopic organisms, including bacteria, viruses, fungi, protozoa, and algae. These microorganisms are often too small to be seen with the naked eye and are studied using specialized instruments such as microscopes."},{"t":"p","x":"Microbiologists study various aspects of microorganisms, including their structure, function, genetics, ecology, and their roles in infectious diseases, environmental processes, food production, and biotechnology. They also explore interactions between microorganisms and other organisms, as well as their impact on human health and the environment."},{"t":"p","x":"Microbiology plays a crucial role in many fields, including medicine (medical microbiology), agriculture (agricultural microbiology), industry (industrial microbiology), and environmental science (environmental microbiology). It has applications in areas such as the development of antibiotics, vaccines, and other medical treatments, food safety and preservation, bioremediation, and genetic engineering."},{"t":"h","x":"Structures of microorganisms"},{"t":"p","x":"Microorganisms encompass a wide range of structures due to their diversity, but some common structures found in various types of microorganisms include:"},{"t":"li","h":"Cell Wall","x":"Many microorganisms, such as bacteria and fungi, have a cell wall that provides structural support and protection. The composition of the cell wall varies among different types of microorganisms. For example, bacterial cell walls are primarily composed of peptidoglycan, while fungal cell walls contain chitin or glucans."},{"t":"li","h":"Plasma Membrane","x":"All microorganisms have a plasma membrane, also known as a cell membrane, which separates the interior of the cell from the external environment. The plasma membrane regulates the passage of molecules into and out of the cell."},{"t":"li","h":"Cytoplasm","x":"The cytoplasm is the gel-like substance that fills the interior of the cell. It contains various organelles, such as ribosomes, where protein synthesis occurs, and nucleic acids, which store genetic information."},{"t":"li","h":"Nucleus or Nucleoid","x":"In eukaryotic microorganisms, such as fungi and some protists, the genetic material (DNA) is enclosed within a membrane-bound nucleus. In prokaryotic microorganisms, such as bacteria, the genetic material is typically found in a region called the nucleoid, which lacks a surrounding membrane."},{"t":"li","h":"Organelles","x":"Eukaryotic microorganisms contain various organelles, including mitochondria (responsible for energy production), Golgi apparatus (involved in protein processing and secretion), endoplasmic reticulum (involved in protein synthesis and lipid metabolism), and vacuoles (storage organelles)."},{"t":"li","h":"Flagella and Cilia","x":"Some microorganisms are motile and possess appendages called flagella or cilia, which they use for movement. Flagella are long, whip-like structures, whereas cilia are shorter and more numerous. These structures are often used for locomotion or to move substances across the cell surface."},{"t":"li","h":"Capsule","x":"Some bacteria and other microorganisms have a capsule, which is a thick, gelatinous layer surrounding the cell wall. The capsule provides protection against desiccation (drying out) and helps the microorganism evade the host immune system."},{"t":"li","h":"Pili or Fimbriae","x":"Pili are hair-like appendages found on the surface of some bacteria. They can be involved in attachment to surfaces or other cells, as well as in bacterial conjugation, which is a mechanism of genetic exchange between bacterial cells."},{"t":"p","x":"These structures represent some of the common features found in microorganisms, but the specific structures and their functions can vary widely depending on the type of microorganism."}]},{"title":"Shapes of Microorganisms","b":[{"t":"p","x":"Microorganisms exhibit a diverse range of shapes, which can be classified into several broad categories. Here are some common shapes of microorganisms:"},{"t":"li","h":"Cocci","x":"Cocci are spherical or ovoid-shaped microorganisms. They can occur singly, in pairs (diplococci), in chains (streptococci), in clusters (staphylococci), or in groups of four (tetrads). Examples include species of Staphylococcus, Streptococcus, and Neisseria."},{"t":"li","h":"Bacilli","x":"Bacilli are rod-shaped microorganisms. They can be straight, curved, or club-shaped. Bacilli can occur singly or in chains (streptobacilli). Examples include Escherichia coli, Bacillus anthracis, and Clostridium botulinum."},{"t":"li","h":"Spirilla","x":"Spirilla are spiral-shaped microorganisms with a rigid helical shape. They may have one or more twists and can be short or elongated. Examples include species of Spirillum and Campylobacter."},{"t":"li","h":"Spirochetes","x":"Spirochetes are spiral-shaped microorganisms with a flexible helical shape. They have a distinctive corkscrew-like appearance and often exhibit motility through axial filaments. Examples include Treponema pallidum (causative agent of syphilis) and Borrelia burgdorferi (causative agent of Lyme disease)."},{"t":"li","h":"Vibrios","x":"Vibrios are comma-shaped microorganisms with a curved rod-like structure. They are slightly curved or comma-shaped and are often motile. Examples include Vibrio cholerae (causative agent of cholera)."},{"t":"li","h":"Filamentous","x":"Filamentous microorganisms are elongated and filamentous in shape, often forming branching structures. Examples include filamentous fungi such as Penicillium and molds."},{"t":"li","h":"Stalked","x":"Stalked microorganisms have a stalk-like extension that attaches them to surfaces. Examples include Caulobacter species."},{"t":"li","h":"Pleomorphic","x":"Pleomorphic microorganisms exhibit variability in shape and lack a distinct, fixed form. They may appear as cocci, bacilli, or irregular shapes under different growth conditions. Examples include some species of Mycoplasma."},{"t":"p","x":"These are just some of the common shapes observed in microorganisms, and there can be variations within each category. Additionally, some microorganisms may exhibit unique or less common shapes not covered here. The shape of a microorganism can provide important clues about its biology, ecology, and potential pathogenicity."}]},{"title":"Sterilization Methods","b":[{"t":"p","x":"Sterilization in a microbiology laboratory is crucial to prevent contamination and ensure the accuracy and reliability of experimental results. Sterilization involves the complete destruction or removal of all forms of microbial life, including bacteria, viruses, fungi, and spores. Here are some common methods of sterilization used in microbiology laboratories:"},{"t":"li","h":"Autoclaving","x":"Autoclaving is one of the most common methods of sterilization. It involves subjecting materials to high-pressure saturated steam at temperatures typically around 121°C (250°F) for a specified period, usually 15-20 minutes. Autoclaving effectively kills microorganisms and spores and is suitable for sterilizing laboratory glassware, media, instruments, and other heat-resistant materials."},{"t":"li","h":"Dry Heat Sterilization","x":"Dry heat sterilization involves heating materials at high temperatures, typically between 160°C to 180°C (320°F to 356°F), for an extended period. This method is suitable for sterilizing glassware, powders, oils, and other heat-stable materials that may be damaged by moist heat. However, it requires longer exposure times compared to autoclaving."},{"t":"li","h":"Incineration","x":"Incineration involves exposing materials to high temperatures, usually above 800°C (1472°F), to completely burn and destroy microorganisms. It is commonly used for the disposal of contaminated materials, such as disposable lab supplies, cultures, and waste."},{"t":"li","h":"Chemical Sterilization","x":"Chemical sterilization involves using chemical agents to kill or inactivate microorganisms. Common chemical sterilants include ethylene oxide, hydrogen peroxide, and glutaraldehyde. These agents are typically used for sterilizing heat-sensitive materials such as plastics, rubber, and electronic equipment."},{"t":"li","h":"Filtration","x":"Filtration involves passing liquids or gases through a filter with pore sizes small enough to trap and remove microorganisms. Membrane filters made of materials such as cellulose acetate or polytetrafluoroethylene (PTFE) are commonly used for microbial filtration. Filtration is suitable for sterilizing heat-sensitive liquids, such as media and solutions containing antibiotics or proteins."},{"t":"li","h":"Ultraviolet (UV) Radiation","x":"UV radiation can be used to sterilize surfaces and air by damaging the DNA of microorganisms, preventing their replication. UV lamps are commonly used in biosafety cabinets, laminar flow hoods, and other laboratory equipment to maintain a sterile environment."},{"t":"li","h":"Radiation Sterilization","x":"Ionizing radiation, such as gamma radiation or electron beam radiation, can be used to sterilize materials by damaging the DNA of microorganisms. This method is commonly used for sterilizing disposable lab supplies, medical devices, and pharmaceutical products."},{"t":"p","x":"It's essential to choose the appropriate sterilization method based on the nature of the materials being sterilized and the specific requirements of the experiment or procedure. Additionally, proper handling and storage of sterilized materials are necessary to maintain their sterility until use."}]},{"title":"Medical Microbiology","b":[{"t":"p","x":"Medical microbiology is a branch of microbiology that specifically focuses on the study of microorganisms that are relevant to human health and disease. It encompasses various aspects of microbiology as they relate to medicine, including the study of pathogenic microorganisms, their interactions with the human body, the immune response to infections, and the diagnosis, treatment, and prevention of infectious diseases."},{"t":"p","x":"Here are some key areas within medical microbiology:"},{"t":"li","h":"Infectious Diseases","x":"Medical microbiologists study the causes, transmission, and epidemiology of infectious diseases caused by bacteria, viruses, fungi, parasites, and other microorganisms. They investigate factors such as the modes of transmission, host-pathogen interactions, and microbial virulence factors."},{"t":"li","h":"Pathogenesis","x":"Understanding how microorganisms cause disease is crucial for developing strategies to diagnose, treat, and prevent infections. Medical microbiologists study the mechanisms by which pathogens invade host tissues, evade the immune system, and cause tissue damage, leading to the development of disease symptoms."},{"t":"li","h":"Diagnostic Microbiology","x":"Medical microbiologists play a vital role in diagnosing infectious diseases by isolating and identifying pathogens from clinical samples, such as blood, urine, sputum, and tissue specimens. They use various techniques, including microscopy, culture, biochemical tests, serology, molecular methods (such as PCR), and advanced technologies like mass spectrometry and next-generation sequencing."},{"t":"li","h":"Antimicrobial Resistance","x":"Medical microbiologists study the emergence and spread of antimicrobial resistance among bacterial, viral, fungal, and parasitic pathogens. They monitor trends in resistance patterns, develop strategies to combat resistance, and provide guidance on appropriate antibiotic use to minimize the development of resistance."},{"t":"li","h":"Immunology","x":"Medical microbiologists investigate the host immune response to infections, including both innate and adaptive immunity. They study how pathogens interact with the immune system, the development of immunity following infection or vaccination, and immunodeficiency disorders that increase susceptibility to infections."},{"t":"li","h":"Vaccinology","x":"Medical microbiologists contribute to the development and evaluation of vaccines against infectious diseases. They study vaccine candidates, assess their safety and efficacy through preclinical and clinical trials, and monitor vaccine coverage and effectiveness in population-based studies."},{"t":"li","h":"Epidemiology","x":"Medical microbiologists analyze the distribution and determinants of infectious diseases in human populations. They investigate outbreaks of infectious diseases, track patterns of transmission, identify risk factors for infection, and develop strategies for disease surveillance and control."},{"t":"li","h":"Infection Control","x":"Medical microbiologists play a crucial role in infection control and prevention efforts within healthcare settings. They develop guidelines for infection control practices, conduct surveillance for healthcare-associated infections, investigate outbreaks, and implement measures to minimize the spread of pathogens."},{"t":"p","x":"Medical microbiology is a dynamic field that continually evolves in response to emerging infectious threats, advances in technology, and changes in healthcare practices. It plays a vital role in protecting public health by advancing our understanding of infectious diseases and improving strategies for their prevention, diagnosis, and treatment."}]},{"title":"Microbial Genetics","b":[{"t":"p","x":"Microbial genetics is the branch of genetics that focuses on the study of the genetic makeup, variation, and processes within microorganisms. Microorganisms, such as bacteria, archaea, fungi, viruses, and protists, serve as model systems for understanding fundamental genetic principles due to their rapid growth rates, simple cellular structures, and ease of genetic manipulation."},{"t":"p","x":"Here are some key aspects of microbial genetics:"},{"t":"li","h":"Genome Structure and Organization","x":"Microbial genetics examines the structure and organization of microbial genomes, including the arrangement of genes, regulatory elements, and non-coding regions. Microbial genomes vary in size, complexity, and organization, with some microorganisms having circular chromosomes, linear chromosomes, or multiple chromosomes and plasmids."},{"t":"li","h":"Gene Expression","x":"Microbial genetics investigates how genes are transcribed into RNA and translated into proteins. It examines the mechanisms of transcriptional regulation, including the role of transcription factors, promoters, enhancers, and repressors. It also explores post-transcriptional processes such as RNA processing, splicing, and stability."},{"t":"li","h":"Genetic Variation","x":"Microbial genetics studies the mechanisms of genetic variation within microbial populations, including mutation, recombination, and horizontal gene transfer. It explores how genetic variation contributes to microbial diversity, adaptation to changing environments, and the evolution of new traits."},{"t":"li","h":"Genetic Analysis Techniques","x":"Microbial genetics employs various experimental techniques to analyze microbial genomes and genetic processes. These techniques include classical genetic methods such as conjugation, transformation, and transduction for introducing foreign DNA into microbial cells. Molecular genetic techniques such as PCR (polymerase chain reaction), DNA sequencing, gene cloning, and gene editing (e.g., CRISPR-Cas) are also widely used."},{"t":"li","h":"Genetic Regulation and Systems Biology","x":"Microbial genetics investigates the regulatory networks that control gene expression and cellular processes in microorganisms. It employs systems biology approaches to model and analyze the interactions between genes, proteins, and metabolites within microbial cells, providing insights into microbial physiology, metabolism, and behavior."},{"t":"li","h":"Genetic Engineering and Biotechnology","x":"Microbial genetics plays a central role in genetic engineering and biotechnology applications. It enables the manipulation of microbial genomes to engineer strains with desired traits, such as improved productivity, enhanced nutrient utilization, and the production of valuable compounds, including biofuels, pharmaceuticals, enzymes, and bioplastics."},{"t":"li","h":"Microbial Pathogenesis","x":"Microbial genetics contributes to our understanding of the genetic determinants of microbial pathogenesis—the process by which microorganisms cause disease. It identifies virulence factors, antibiotic resistance genes, and other genetic elements that influence microbial pathogenicity, host interactions, and the development of infectious diseases."},{"t":"p","x":"Overall, microbial genetics is a dynamic and interdisciplinary field that combines principles of genetics, molecular biology, biochemistry, microbiology, and bioinformatics to unravel the genetic mechanisms underlying microbial biology and diversity. It has broad applications in basic research, biotechnology, medicine, agriculture, and environmental science."},{"t":"h","x":"Five DNA bases instead of four"},{"t":"p","x":"It seems like you're asking about the possibility of having five DNA bases instead of the usual four. In standard DNA, there are four nucleotide bases: adenine (A), thymine (T), cytosine (C), and guanine (G)."},{"t":"p","x":"While naturally occurring DNA utilizes these four bases, there has been research into expanding the genetic alphabet by incorporating additional synthetic bases. This field of research is often referred to as \"xenobiology\" or \"xenogenetics.\""},{"t":"p","x":"One example of such an expanded genetic alphabet is the inclusion of an additional base pair beyond the standard A-T and C-G pairs. In this context, scientists have explored bases such as:"},{"t":"li","h":"X (base)","x":"This hypothetical base could pair with Y in a complementary manner, expanding the genetic code from four to six bases. However, the synthesis and incorporation of such bases into functional DNA molecules are complex challenges that require careful design and testing."},{"t":"p","x":"Research into expanding the genetic alphabet is still in its early stages, and there are significant technical hurdles to overcome before such systems could be implemented for practical applications. However, the potential benefits of an expanded genetic alphabet include increased information storage capacity and the ability to create novel proteins with unique properties."}]}];

 if(show)nav.innerHTML=[['home','home','Home'],['setup','prac','Practice'],['notes','book','Notes'],['prog','chart','Progress'],['grp','users','Group']].map(([v,i,l])=>`<button class="${V===v&&(v!=='setup'||cfg.mode==='practice')?'on':''}" data-a="nav" data-v="${v}">${IC[i]}<span>${l}</span></button>`).join('');
}
function go(v,o={}){
 if((v==='lb'||v==='chat')&&!D.fb.g)v='grp';
 if(v!==V)stopLive();if(V==='wsess'&&v!=='wsess'){wsave();wstop()}V=v;OV=null;G=false;
 if(!o.pop){if(o.replace)history.replaceState({v,n:HD},'');else{HD++;history.pushState({v,n:HD},'')}}
 render();scrollTo(0,0);
 if(v==='lb')lbStart();if(v==='chat')chatStart();
}
function stop(){clearInterval(tid);tid=null}
function saveRun(){D.run={mode:cfg.mode,i:R.i,el:R.el,lim:R.lim,items:R.items};save()}
function startTimer(){
 stop();tid=setInterval(()=>{R.el++;
  if(V==='sess'){const e=$('#tm');if(e){e.textContent=tmTxt();e.classList.toggle('low',!!R.lim&&R.lim*60-R.el<60)}}
  if(R.lim&&R.el>=R.lim*60){finish();return}
  if(R.el%5===0)saveRun()},1000);
}
function begin(){
 let ids=shuf(pool());if(cfg.count&&cfg.count<ids.length)ids=ids.slice(0,cfg.count);
 R={items:ids.map(id=>({id,order:shuf([0,1,2,3]),sel:-1,flag:false,rec:false,hint:false,rm:null})),i:0,el:0,lim:cfg.limit};
 if(cfg.mode!=='missed'&&cfg.count)D.pref.count=cfg.count;
 saveRun();startTimer();RF='all';go('sess',{replace:true});
}
function finish(){
 stop();D.run=null;
 if(!fb())R.items.forEach(x=>{if(x.sel>=0&&!x.rec){rec(x.id,x.order.indexOf(0)===x.sel);x.rec=true}});
 const c=R.items.filter(x=>x.sel>=0&&x.order.indexOf(0)===x.sel).length;
 if(R.items.some(x=>x.sel>=0)){D.hist.unshift({d:Date.now(),m:cfg.mode,n:R.items.length,c,t:R.el});D.hist=D.hist.slice(0,30);qSession({d:D.hist[0].d,m:cfg.mode,n:R.items.length,c,a:R.items.filter(x=>x.sel>=0).length,t:R.el});save()}
 save();go('res',{replace:true});
}
function openSetup(m,pre,o){
 cfg.mode=m;cfg.limit=m==='exam'?20:0;
 if(pre!=null)cfg.topics=new Set([pre]);else if(!cfg.topics.size||m!==V)cfg.topics=new Set(T.map((_,i)=>i));
 if(m==='missed')cfg.count=0;else if(!cfg.count)cfg.count=20;
 go('setup',o);
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,d=el.dataset;
 if(a==='stop')return;
 if(a==='theme'){D.theme=theme()==='light'?'dark':'light';save();render()}
 else if(a==='go')go(d.v);
 else if(a==='nav'){if(d.v===V&&(V!=='setup'||cfg.mode==='practice'))return;if(d.v==='setup')openSetup('practice',null,{replace:true});else go(d.v,{replace:true})}
 else if(a==='hb'){if(HD>0)history.back();else go(d.f,{replace:true})}
 else if(a==='pal'){D.pal=d.p;save();render()}
 else if(a==='br'){D.theme=d.b;save();render()}
 else if(a==='mode')openSetup(d.m);
 else if(a==='topic'){cfg.count=20;openSetup('practice',+d.t)}
 else if(a==='tgl'){const t=+d.t;cfg.topics.has(t)?cfg.topics.delete(t):cfg.topics.add(t);render()}
 else if(a==='all'){cfg.topics=new Set(T.map((_,i)=>i));render()}
 else if(a==='none'){cfg.topics=new Set();render()}
 else if(a==='cnt'){cfg.count=+d.n;render()}
 else if(a==='lim'){cfg.limit=+d.n;render()}
 else if(a==='start')begin();
 else if(a==='pick'){const it=R.items[R.i];if(fb()&&it.sel>=0)return;if(it.rm&&it.rm.includes(+d.i))return;it.sel=+d.i;if(fb()){rec(it.id,it.order.indexOf(0)===it.sel);it.rec=true}saveRun();render()}
 else if(a==='next'){if(R.i<R.items.length-1){R.i++;saveRun();render();scrollTo(0,0)}}
 else if(a==='prev'){if(R.i>0){R.i--;saveRun();render();scrollTo(0,0)}}
 else if(a==='flag'){R.items[R.i].flag=!R.items[R.i].flag;saveRun();render()}
 else if(a==='grid'){G=!G;render()}
 else if(a==='jump'){R.i=+d.i;G=false;saveRun();render();scrollTo(0,0)}
 else if(a==='ask'){G=false;const u=R.items.filter(x=>x.sel<0).length;OV={t:'Submit session',b:u?`${u} question${u===1?' is':'s are'} still unanswered. Submit anyway?`:'All questions are answered. Submit your session?',y:'fin',yl:'Submit',nl:'Keep working'};render()}
 else if(a==='fin')finish();
 else if(a==='quit'){OV={t:'Leave this session',b:'Your place and answers are saved. Resume this session from the home screen whenever you are ready.',y:'leave',yl:'Save and leave',nl:'Stay'};render()}
 else if(a==='leave'){saveRun();stop();if(HD>0)history.back();else go('home',{replace:true})}
 else if(a==='hint'){const it=R.items[R.i];if(!fb()||it.sel>=0||it.hint)return;const cp=it.order.indexOf(0);it.rm=shuf([0,1,2,3].filter(x=>x!==cp)).slice(0,2);it.hint=true;saveRun();render()}
 else if(a==='resume'){const r=D.run;if(!r)return;cfg.mode=r.mode;R={items:r.items,i:r.i,el:r.el,lim:r.lim};if(R.lim&&R.el>=R.lim*60){finish();return}startTimer();RF='all';go('sess')}
 else if(a==='disc'){D.run=null;save();render()}
 else if(a==='note'){NT=+d.t;NB=d.b;go('note')}
 else if(a==='nback')go(NB);
 else if(a==='exp'){const b=new Blob([JSON.stringify(D)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='mcb201-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
 else if(a==='imp')$('#imp').click();
 else if(a==='c'){CK=d.k;const m={hist:['Clear session history','This removes the list of completed sessions. Accuracy and missed questions are kept.'],missed:['Clear missed questions','This empties the missed questions list. Accuracy and history are kept.'],stats:['Clear topic accuracy','This resets answered counts and accuracy for every topic. History and missed questions are kept.'],all:['Clear all data','This removes accuracy, missed questions, history, any saved session and your theme choice from this device.']}[CK];OV={t:m[0],b:m[1],y:'cdo',yl:'Clear',nl:'Cancel'};render()}
 else if(a==='cdo'){if(CK==='hist')D.hist=[];else if(CK==='missed')D.missed=[];else if(CK==='stats')D.stats={};else{const f=D.fb;D=D0();D.fb=f;cfg.count=20;cfg.limit=0}save();OV=null;render()}
 else if(a==='cancel'){OV=null;render()}
 else if(a==='rev'){RF='all';go('rev')}
 else if(a==='back')go('res');
 else if(a==='rf'){RF=d.f;render()}
 else if(a==='again')openSetup(cfg.mode);
});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o.stats!=='object'||!Array.isArray(o.missed)||!Array.isArray(o.hist))throw 0;merge(o);save();cfg.count=D.pref.count||20;OV={t:'Backup imported',b:'Your progress was restored from the backup file.',y:'cancel',yl:'Done',nl:'Close'}}catch(x){OV={t:'Import failed',b:'That file is not a valid MCB 201 backup.',y:'cancel',yl:'Close',nl:'Cancel'}}render()};
 r.readAsText(f);e.target.value=''});
addEventListener('popstate',e=>{
 const st=e.state||{v:'home',n:0},was=V,prev=HD;HD=st.n||0;
 if(was==='sess'&&st.v!=='sess'&&tid){HD=prev;history.pushState({v:'sess',n:HD},'');G=false;OV={t:'Leave this session',b:'Your place and answers are saved. Resume this session from the home screen whenever you are ready.',y:'leave',yl:'Save and leave',nl:'Stay'};render();return}
 let t=st.v;
 if((t==='sess'&&!tid)||((t==='res'||t==='rev')&&!R)||((t==='wsess'||t==='wres')&&!WR))t='home';
 go(t,{pop:true});
 if(t!==st.v)history.replaceState({v:t,n:HD},'');
});
['copy','cut','contextmenu','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName||''))e.preventDefault()}));
document.addEventListener('selectstart',e=>{if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName||''))e.preventDefault()});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
history.replaceState({v:'home',n:0},'');
render();
if(!had)idbGet().then(v=>{if(v){try{merge(JSON.parse(v));cfg.count=D.pref.count||20;render()}catch(e){}}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(x=>{ST.persisted=x;if(V==='prog')render()})}catch(e){}
